name: Mobile Security Audit & OWASP Scanner

on:
  push:
    branches: [ master, main, 'feat/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-audit:
    name: APK Security Analysis & Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Test Runner
        run: |
          python -m pip install --upgrade pip
          # Static tests/reporting do not need Frida, mitmproxy or Windows drivers.
          python -m pip install pytest requests cryptography

      - name: Run Automated Test Suite
        run: |
          python -m pytest android-lab/lab/tests -v

      - name: Verify Environment Pre-Flight
        run: |
          cd android-lab/lab
          python orchestrator.py preflight

      - name: Build / Prepare Target APK
        run: |
          cd android-lab/lab
          python scripts/create_sample_apk.py

      - name: Run Deep App Security Analyzer
        run: |
          cd android-lab/lab
          python scripts/app_analyzer.py scripts/vulnerable-test.apk artifacts/security-scan

      - name: Generate Multi-Format HTML5, MD & JSON Reports
        run: |
          cd android-lab/lab
          python scripts/app_reporter.py artifacts/security-scan/app-analysis.json -o artifacts/security-scan

      - name: Publish Security Audit to GitHub Job Summary
        run: |
          if [ -f android-lab/lab/artifacts/security-scan/security-report.md ]; then
            cat android-lab/lab/artifacts/security-scan/security-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Security Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-security-audit-report
          path: |
            android-lab/lab/artifacts/security-scan/security-report.html
            android-lab/lab/artifacts/security-scan/security-report.md
            android-lab/lab/artifacts/security-scan/security-report.json
