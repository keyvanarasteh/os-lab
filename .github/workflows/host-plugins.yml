name: host-plugins

# Cursor, ZCode and Grok Build plugin package checks. Install is file-based
# (project MCP config); no host CLI is required on the runner.

on:
  pull_request:
    paths: &paths
      - '.grok-plugin/**'
      - 'plugins/cursor/**'
      - 'plugins/zcode/**'
      - 'plugins/grok/**'
      - 'plugins/mcp/cursor/**'
      - 'plugins/mcp/zcode/**'
      - 'plugins/mcp/grok/**'
      - 'console/host_plugin*'
      - 'console/cursor_requirements.json'
      - 'console/zcode_requirements.json'
      - 'console/grok_requirements.json'
      - 'console/mcp_host_plugins.py'
      - 'console/mcp_*'
      - 'scripts/cursor-plugin.py'
      - 'scripts/zcode-plugin.py'
      - 'scripts/grok-plugin.py'
      - 'android-lab/lab/tests/test_host_plugins.py'
      - '.github/workflows/host-plugins.yml'
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plugin tests
        run: |
          python -m pip install --quiet pytest requests cryptography
          cd android-lab/lab && python -m pytest tests/test_host_plugins.py -q
      - name: Helper check and doctor
        run: |
          for host in cursor zcode grok; do
            python scripts/${host}-plugin.py build --check
            python scripts/${host}-plugin.py check
            python scripts/${host}-plugin.py doctor || true
          done
