<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>macOS Lab</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.45 var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,#1c1c1a);background:var(--color-background-primary,#f7f6f2);padding:12px}h1{font-size:16px;margin:0 0 8px}h2{font-size:13px;margin:12px 0 6px;color:var(--color-text-secondary,#5c5c56)}.muted{color:var(--color-text-secondary,#5c5c56);font-size:12px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--color-border-tertiary,#e6e4dc)}.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--color-background-secondary,#ebe9e2);font-size:12px}.ok{background:#d9f0df}.warn{background:#fde8c8}.bad{background:#f8d4d4}button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--color-border-primary,#cfcabf);background:var(--color-background-primary,#fff);cursor:pointer}button.primary{background:#1c1c1a;color:#fff;border-color:#1c1c1a}ul{margin:0;padding-left:18px}pre{white-space:pre-wrap;font-size:11px}.empty{padding:16px;color:var(--color-text-secondary,#5c5c56)}.hero{padding:8px 0 12px}.hero .title{font-size:22px;font-weight:700;letter-spacing:-0.02em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:480px){.grid{grid-template-columns:1fr}}.card{padding:10px;border:1px solid var(--color-border-tertiary,#e6e4dc);border-radius:12px}</style>
</head>
<body>
<main id="root"><p class="muted">Waiting for data…</p></main>
<!-- MCP_BRIDGE -->
<script>

window.__oslabUi.onUpdate(function (s) {
  var d = s.output || {};
  var apps = d.apps || d.windows || [];
  if (apps.windows) apps = apps.windows;
  if (!Array.isArray(apps)) apps = [];
  var control = d.control || d.controlState || {};
  var perms = d.permissions || {};
  document.getElementById("root").innerHTML = "<div class=\"hero\"><div class=\"muted\">macOS Lab</div>"
    + "<div class=\"title\">Observe</div>"
    + "<span class=\"chip\">"+(control.armed ? "armed" : "observe")+"</span></div>"
    + "<div class=\"grid\">"
    + "<div class=\"card\"><h2>Windows</h2><p class=\"muted\">"+apps.length+" visible</p>"
    + "<button class=\"primary\" id=\"apps\">Refresh apps</button></div>"
    + "<div class=\"card\"><h2>Control</h2><p class=\"muted\">Arm from the dashboard — no MCP arm tool.</p>"
    + "<button id=\"ctrl\">Control state</button></div>"
    + "</div>"
    + "<h2>Top windows</h2>"+(apps.slice(0,8).map(function(w){return "<div class=\"row\"><span>"+(w.app||w.title||w.windowId)+"</span><span class=\"chip\">"+(w.windowId||"")+"</span></div>";}).join("")||"<p class=\"muted\">None</p>")
    + "<h2>Permissions</h2><pre class=\"muted\">"+JSON.stringify(perms,null,2)+"</pre>";
  document.getElementById("apps").onclick = function(){ window.__oslabUi.callTool("macos_apps", {}); };
  document.getElementById("ctrl").onclick = function(){ window.__oslabUi.callTool("macos_control_state", {}); };
});

</script>
</body>
</html>
