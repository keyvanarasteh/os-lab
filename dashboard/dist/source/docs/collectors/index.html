havior. Browser failures use &lt;code&gt;collection_failed&lt;/code&gt;; partial events are not\ncorrelated. Static analysis remains usable in either case.&lt;/p&gt;\n&lt;p&gt;The engine retains four Python libraries:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Module under &lt;code&gt;source_lab.collectors&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;Inputs&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;windows.importer.WindowsTelemetryImporter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operator PE-sieve results and ETW events&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;macos.importer.MacOSTelemetryImporter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;dyld image lists and Objective-C swizzles&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;android.importer.AndroidTelemetryImporter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Process maps, thread names and logcat&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ios.importer.IOSTelemetryImporter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Loaded dylibs and trampoline observations&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Each accepts &lt;code&gt;output_root&lt;/code&gt; and &lt;code&gt;TargetIdentity&lt;/code&gt; on construction and writes a signed\nbundle through &lt;code&gt;import_session(...)&lt;/code&gt;. Pass &lt;code&gt;synthetic=True&lt;/code&gt; for generated or\nsimulated telemetry. Imported telemetry includes an explicit limitation: these\nlibraries do not launch native collectors or independently attest input origin.\nNative collection workflows remain NEXT-02, not an installed capability.&lt;/p&gt;\n&lt;p&gt;Configure &lt;code&gt;IQ_SESSION_HMAC_KEY&lt;/code&gt; or &lt;code&gt;IQ_SESSION_HMAC_KEY_FILE&lt;/code&gt; before importing.\nKeys must contain at least 32 bytes; console-managed files are mode 0600 where\nsupported. Matching environment and file values are accepted; conflicting values\nfail closed. Never put keys in CLI arguments, catalog data or version control.&lt;/p&gt;\n&lt;p&gt;Put operator-reviewed session bundles in the matching target’s\n&lt;code&gt;analysis/&amp;lt;slug&amp;gt;/runtime-sessions/&amp;lt;session&amp;gt;/&lt;/code&gt; directory. Evidence GET can review\nmetadata/events, explicitly labeled unverified. Preview and confirm\n&lt;code&gt;settings/runtime&lt;/code&gt; with &lt;code&gt;action=verify-session&lt;/code&gt;, &lt;code&gt;slug&lt;/code&gt;, &lt;code&gt;session&lt;/code&gt; for local HMAC\nand hash verification; a successful job validates integrity, not whether a\ncollector’s claims are true. Use detection’s &lt;code&gt;session&lt;/code&gt; option to correlate.\nCorrelation requires valid signed metadata/events, matching target and platform,\nand a nonsynthetic, successful collection. Rotation requires the original key\nfor old bundles; rotation never rewrites old signatures.&lt;/p&gt;\n&quot;],&quot;slug&quot;:[0,&quot;collectors&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;SourceDocs&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
