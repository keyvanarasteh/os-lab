ate export or upstream dataset is shipped. Operators may supply\nfirst-party or otherwise authorized exports. This is a file-backed adaptation of\nthe pinned source UI’s hooks, not a promise that its deployment APIs exist here.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Source surface&lt;/th&gt;\n&lt;th&gt;Local implementation/provider decision&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Tabs / graph / filters / legend / sidebar&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;manifest.json&lt;/code&gt; tabs and graph nodes/edges; bounded in-memory page/window.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Usages&lt;/td&gt;\n&lt;td&gt;Incoming/outgoing snapshot edges, with links to related nodes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Source&lt;/td&gt;\n&lt;td&gt;Optional &lt;code&gt;providers.source&lt;/code&gt; JSON indexed by source path; plain text only.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;History / side-by-side diff&lt;/td&gt;\n&lt;td&gt;Optional &lt;code&gt;providers.history&lt;/code&gt;, indexed by path with revision/content records.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Flowchart&lt;/td&gt;\n&lt;td&gt;Node &lt;code&gt;data.flowSteps&lt;/code&gt; or optional &lt;code&gt;providers.flow&lt;/code&gt;, indexed by node ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sequence&lt;/td&gt;\n&lt;td&gt;Snapshot edges or optional &lt;code&gt;providers.sequence&lt;/code&gt;, indexed by node ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;AI rules&lt;/td&gt;\n&lt;td&gt;Optional static &lt;code&gt;providers.aiRules&lt;/code&gt;; no model call or Skills integration.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Complexity / risk&lt;/td&gt;\n&lt;td&gt;Recorded metrics and snapshot rankings; no security-certification claim.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Stress&lt;/td&gt;\n&lt;td&gt;Upstream executes against a live Laravel app. No such provider is configured; show unavailable, never simulate a successful test. Authorized snapshot results may be reviewed separately.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Export / theme / virtual store&lt;/td&gt;\n&lt;td&gt;Browser-generated JSON export, shared theme, bounded in-memory state; no snapshot content saved to browser storage.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Example manifest contract (operator input, not a bundled dataset):&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;json\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;{&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;date\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;YYYY-MM-DD\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;tabs\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:[{&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;id\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;owned\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;label\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;Owned project\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;file\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;graphs/owned.json\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;}],&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;providers\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:{&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;source\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;providers/source.json\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;history\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;providers/history.json\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;flow\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;providers/flow.json\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;sequence\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;providers/sequence.json\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;\&quot;aiRules\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;providers/rules.json\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;}}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Graphs have &lt;code&gt;meta&lt;/code&gt;, &lt;code&gt;nodes&lt;/code&gt; (&lt;code&gt;id&lt;/code&gt;, &lt;code&gt;label&lt;/code&gt;, &lt;code&gt;type&lt;/code&gt;, &lt;code&gt;data&lt;/code&gt;) and &lt;code&gt;edges&lt;/code&gt; (&lt;code&gt;source&lt;/code&gt;,\n&lt;code&gt;target&lt;/code&gt;, optional &lt;code&gt;id&lt;/code&gt;/&lt;code&gt;type&lt;/code&gt;/&lt;code&gt;label&lt;/code&gt;). Duplicate node IDs fail; dangling edges\nare omitted with a visible count. Limits: 20,000 nodes / 50,000 edges, at most\n200 rendered nodes per window; existing 5 MB per-file and 16 MB request limits\nremain. JSON files and tab IDs are validated; provider URLs cannot escape the\nprivate JSON root or become external fetches. Missing providers are explicit\nunavailable states. Read-only GETs never run an application or collect telemetry.&lt;/p&gt;\n&lt;p&gt;The implemented SVG viewer draws 100 nodes per page and at most 2,000 edges\nwithin that window, with an accessible node list and keyboard selection. Export\npreserves the full loaded snapshot, independent of the current viewport/filter.\nFlow display is capped at 300 steps/eight nesting levels; original data remains\nin node details/export. Revision diff uses bounded LCS (1,000 lines per side),\nwith truncation shown. Metrics rank recorded complexity/risk values for review,\nnot observed malicious behavior. Missing live stress support stays unavailable.&lt;/p&gt;\n&lt;p&gt;Source provider values are strings or &lt;code&gt;{content}&lt;/code&gt; records keyed by path. History\nvalues are arrays of &lt;code&gt;{revision, content}&lt;/code&gt; records keyed by path. Flow/sequence/\nAI-rule values are keyed by node ID; &lt;code&gt;aiRules.global&lt;/code&gt; is also supported. No\nsource string, flow instruction or AI rule is executed.&lt;/p&gt;\n&quot;],&quot;slug&quot;:[0,&quot;brain&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;SourceDocs&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
