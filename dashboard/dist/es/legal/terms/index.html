 channels. &lt;strong&gt;They do not change the\n&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/LICENSE\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Apache License 2.0&lt;/a&gt;&lt;/strong&gt;, which is the only licence that governs\nthe source code.&lt;/p&gt;\n&lt;h2 id=\&quot;1-what-os-lab-is\&quot;&gt;1. What os-lab is&lt;/h2&gt;\n&lt;p&gt;os-lab is open-source software that you download and run on your own computer\nor server. It builds isolated security labs (an Android analysis stack, Windows,\nLinux and macOS/iOS virtual machines) with Docker and KVM, and a web console\nthat controls them. Source Lab adds local static source/package analysis,\nstructural maps and explicitly invoked repository/evidence workflows; it does\nnot require a guest for static analysis.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;There is &lt;strong&gt;no hosted service&lt;/strong&gt;. The project does not operate servers that\nreceive your data, and the web console listens only on &lt;code&gt;127.0.0.1&lt;/code&gt; on the\nmachine where you start it.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;You are the operator.&lt;/strong&gt; Whoever installs and runs a copy of the Software\ndecides what it is used for and is responsible for that use, for the systems\nand data it touches, and for complying with the law.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;2-licence\&quot;&gt;2. Licence&lt;/h2&gt;\n&lt;p&gt;The Software is licensed under the Apache License, Version 2.0. You may use,\nmodify and distribute it under that licence, including its conditions on notices\nand attribution. Third-party components keep their own licences; see\n&lt;a href=\&quot;/es/legal/third-party/\&quot;&gt;Third-Party Notices&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\&quot;3-lawful-and-authorized-use\&quot;&gt;3. Lawful and authorized use&lt;/h2&gt;\n&lt;p&gt;The labs contain offensive-security tooling: traffic interception (mitmproxy),\nruntime instrumentation (Frida), APK patching, IPC fuzzing, decompilation and\nport scanning. Using such tools against systems, applications or data without\npermission can be a criminal offence, including under Articles 243–244 of the\nTurkish Penal Code (No. 5237), the U.S. Computer Fraud and Abuse Act, the U.K.\nComputer Misuse Act 1990 and equivalent laws elsewhere.&lt;/p&gt;\n&lt;p&gt;Only analyse applications, devices, networks and services that you own or that\nyou are expressly authorized in writing to test, and only within that scope. The\n&lt;a href=\&quot;/es/legal/acceptable-use/\&quot;&gt;Acceptable Use Policy&lt;/a&gt; sets out what the project supports.&lt;/p&gt;\n&lt;h2 id=\&quot;4-operating-system-and-software-licences\&quot;&gt;4. Operating-system and software licences&lt;/h2&gt;\n&lt;p&gt;The labs automate the installation of software that the project does not own or\nlicence to you:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Windows&lt;/strong&gt; (&lt;code&gt;win-lab&lt;/code&gt;, via &lt;code&gt;dockurr/windows&lt;/code&gt;): you must hold a valid Windows\nlicence for every installation and comply with the Microsoft Software\nLicence Terms. Evaluation media is limited to evaluation use.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;macOS&lt;/strong&gt; (&lt;code&gt;ios-lab&lt;/code&gt;, via &lt;code&gt;dockurr/macos&lt;/code&gt;): Apple’s macOS licence agreement\npermits virtualization of macOS only on Apple-branded hardware. Running the\nmacOS VM on other hardware may breach that licence; on such hosts use the\nnative macOS path or a Mac. Xcode and the iOS Simulator are governed by\nApple’s own terms.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Android emulator images, SDK tools and Google Play services&lt;/strong&gt; are governed\nby Google’s Android SDK terms.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Container images and tools&lt;/strong&gt; (Docker-Android, MobSF, mitmproxy, JADX, Frida\nand others) are governed by their own licences.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You are responsible for obtaining and complying with these licences. Nothing in\nthe Software or its documentation grants you rights to third-party software.&lt;/p&gt;\n&lt;h2 id=\&quot;5-data-you-process-with-the-labs\&quot;&gt;5. Data you process with the labs&lt;/h2&gt;\n&lt;p&gt;When you intercept traffic, dump application sandboxes or analyse apps, you may\nprocess personal data and confidential information belonging to others. For that\nprocessing you are the controller: you need a lawful basis and must meet your\nobligations under applicable law, including the Turkish Personal Data\nProtection Law No. 6698 (KVKK) and the EU General Data Protection Regulation\n(GDPR) where they apply. Keep captures and artifacts only as long as needed,\nprotect them, and delete them when the engagement ends.&lt;/p&gt;\n&lt;h2 id=\&quot;6-isolation-and-safety\&quot;&gt;6. Isolation and safety&lt;/h2&gt;\n&lt;p&gt;Guests can run untrusted or malicious software. Keep labs isolated from\nproduction networks and sensitive data, do not expose lab ports or the web\nconsole to untrusted networks, and keep the host patched. Some actions (for\nexample &lt;strong&gt;Install dependencies&lt;/strong&gt;) install packages, change user groups and\nsystem services, and require administrator rights: review the preview the\nconsole shows before confirming.&lt;/p&gt;\n&lt;h2 id=\&quot;7-no-warranty\&quot;&gt;7. No warranty&lt;/h2&gt;\n&lt;p&gt;As stated in section 7 of the Apache License, the Software is provided on an\n&lt;strong&gt;“AS IS” BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND&lt;/strong&gt;, express or\nimplied, including warranties of title, non-infringement, merchantability or\nfitness for a particular purpose. Findings, scores and reports produced by the\nlabs are automated and can be incomplete or wrong; they are not a security\naudit, certification or legal advice.&lt;/p&gt;\n&lt;h2 id=\&quot;8-limitation-of-liability\&quot;&gt;8. Limitation of liability&lt;/h2&gt;\n&lt;p&gt;As stated in section 8 of the Apache License, and to the extent permitted by\napplicable law, no contributor is liable to you for damages of any kind,\nincluding direct, indirect, special, incidental or consequential damages,\narising from the use of or inability to use the Software, including loss of\ndata, systems or goodwill, or damage to third parties caused by your use.\nLiability that cannot be excluded by law, such as for intent or gross\nnegligence, is not excluded.&lt;/p&gt;\n&lt;h2 id=\&quot;9-trademarks\&quot;&gt;9. Trademarks&lt;/h2&gt;\n&lt;p&gt;Windows is a trademark of Microsoft Corporation; Apple, macOS, iOS and Xcode\nare trademarks of Apple Inc.; Android and Google Play are trademarks of Google\nLLC; Docker is a trademark of Docker, Inc. Other names belong to their owners.\nos-lab is an independent project and is not affiliated with, endorsed or\nsponsored by any of them.&lt;/p&gt;\n&lt;h2 id=\&quot;10-changes-and-contact\&quot;&gt;10. Changes and contact&lt;/h2&gt;\n&lt;p&gt;These terms may be updated; the date above shows the current version, and the\nhistory is in this repository. Questions go to the project’s\n&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/issues\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;GitHub issues&lt;/a&gt;; security\nreports follow &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/SECURITY.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;SECURITY.md&lt;/a&gt;.&lt;/p&gt;\n&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;LegalDocPage&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
