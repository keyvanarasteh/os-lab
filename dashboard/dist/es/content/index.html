;th&gt;What&lt;/th&gt;\n&lt;th&gt;Installed&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;data&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Firewall Lab companies, catalog, schema, knowledge and templates; iOS knowledge notes; &lt;code&gt;docs/legal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;when you press update&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;hooks&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Frida scripts in &lt;code&gt;android-lab/lab/hooks&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;only when you ask for hooks, every time&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;never&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;labctl&lt;/code&gt;, the console, lab scripts, installers, the dashboard build&lt;/td&gt;\n&lt;td&gt;these ship with the app and change only with an app release&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Hook scripts run inside other processes with the privileges of the app you test, so they are\na separate choice and never arrive silently.&lt;/p&gt;\n&lt;h2 id=\&quot;how-to-use-it\&quot;&gt;How to use it&lt;/h2&gt;\n&lt;p&gt;Opening &lt;strong&gt;This computer&lt;/strong&gt; checks the small signed manifest when the last check is older than 15\nminutes. The content pack itself downloads only after you press the update button.\n&lt;code&gt;OSLAB_CONTENT_OFFLINE=1&lt;/code&gt; switches off both checks and updates.&lt;/p&gt;\n&lt;p&gt;In the dashboard, open &lt;strong&gt;This computer&lt;/strong&gt; and find &lt;strong&gt;Content updates&lt;/strong&gt;. The compact card shows the\ninstalled and latest versions. &lt;strong&gt;Check and update&lt;/strong&gt; verifies the manifest and installs a newer\nsigned data pack, with progress status. &lt;strong&gt;Advanced options&lt;/strong&gt; keeps the separate &lt;strong&gt;Check for updates&lt;/strong&gt;,\n&lt;strong&gt;Update content&lt;/strong&gt;, &lt;strong&gt;Include Frida hooks&lt;/strong&gt; checkbox (off every time), and &lt;strong&gt;Reset to bundled&lt;/strong&gt;.\nIf hooks are already installed, the compact button opens Advanced options so you can make that\nchoice again before updating.\nThe Firewall Lab then lists the\ndownloaded companies; a company that is new in the pack opens from the same address, drawn from the pack.&lt;/p&gt;\n&lt;p&gt;From a terminal, in an os-lab checkout:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python3&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; console/content.py&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; status&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;            # what is installed, and the last check&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python3&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; console/content.py&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; check&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;             # is there a newer signed pack? installs nothing&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python3&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; console/content.py&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; update&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;            # install the newest data&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python3&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; console/content.py&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; update&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --hooks&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;    # ...and the Frida hooks too&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python3&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; console/content.py&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; reset&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;             # delete downloaded content, use the bundled copy again&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;The console serves the same actions to the dashboard under &lt;code&gt;/api/content/&lt;/code&gt; (&lt;code&gt;status&lt;/code&gt;,\n&lt;code&gt;companies&lt;/code&gt;, &lt;code&gt;file?path=&lt;/code&gt;, and the POSTs &lt;code&gt;check&lt;/code&gt;, &lt;code&gt;update&lt;/code&gt; with &lt;code&gt;{\&quot;hooks\&quot;: true}&lt;/code&gt;, and &lt;code&gt;reset&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Where the downloaded files go:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;How you run os-lab&lt;/th&gt;\n&lt;th&gt;Folder&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Desktop app&lt;/td&gt;\n&lt;td&gt;its data folder, &lt;code&gt;content/&lt;/code&gt; (macOS: &lt;code&gt;~/Library/Application Support/com.keyvanarasteh.oslab/content&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;labctl ui&lt;/code&gt; or the console&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;~/.oslab/content&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;anything&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;OSLAB_CONTENT_DIR&lt;/code&gt; if set&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Downloaded files sit beside the bundled copy, never over it, so &lt;code&gt;reset&lt;/code&gt; always returns to\nexactly what shipped. Use the same &lt;code&gt;OSLAB_CONTENT_DIR&lt;/code&gt; for the terminal and the app if you\nwant them to share one overlay.&lt;/p&gt;\n&lt;h2 id=\&quot;why-it-is-safe\&quot;&gt;Why it is safe&lt;/h2&gt;\n&lt;p&gt;Every pack has a manifest listing each file with its SHA-256 and size. The manifest is signed\nwith an Ed25519 key that is not in the repository; the app contains only the public key. Before\ninstalling, the client checks the signature, the pack hash, and every file. A file that is not\nlisted, has the wrong hash or size, is a link, or has an unsafe path rejects the whole update.\nFiles are staged and swapped in, an older pack than the installed one is refused, and downloads\nare HTTPS only. Details and the key policy: &lt;code&gt;lat.md/content.md&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;A content update changes what you see (companies, guides, hook scripts). It does not change\nwhat the app is allowed to run, and it adds no new network access beyond the check itself.&lt;/p&gt;\n&lt;h2 id=\&quot;how-a-contribution-reaches-users\&quot;&gt;How a contribution reaches users&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;You open a pull request that changes a content file (for example a company in\n&lt;code&gt;firewall-lab/companies/&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;CI validates the company schema, builds the pack and runs the client’s own manifest checks.&lt;/li&gt;\n&lt;li&gt;A maintainer reviews and merges.&lt;/li&gt;\n&lt;li&gt;On merge to &lt;code&gt;master&lt;/code&gt; the workflow signs a new pack and replaces the &lt;code&gt;content-latest&lt;/code&gt; release.&lt;/li&gt;\n&lt;li&gt;Installed apps pick it up the next time their user checks for updates.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;A merged mistake therefore reaches people only through that user-initiated check, and the\nprevious pack stays available as &lt;code&gt;content-&amp;lt;sequence&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\&quot;proof-for-contributions\&quot;&gt;Proof for contributions&lt;/h2&gt;\n&lt;p&gt;A reviewer can merge faster when they can see that your change works. None of this is\nrequired, and it never replaces review; it is how you show your work.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;1. Verification report (recommended, takes seconds).&lt;/strong&gt; Run it in your branch and paste the\noutput into the pull request:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python3&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; scripts/verify-content.py&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;It runs the same checks as CI and lists every content file you changed with its class, size\nand SHA-256, so the reviewer sees exactly what would ship. CI also prints this report in the\njob summary. Use &lt;code&gt;--out proof.md&lt;/code&gt; to keep a copy, or &lt;code&gt;--all&lt;/code&gt; to cover every content file.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;2. A short video or animation (optional).&lt;/strong&gt; For a company or guide, a 10 to 30 second\nscreen recording of the dashboard showing your change is the clearest proof. For a hook, a\nrecording of it running in the lab against an app you own. Record with any screen recorder\n(QuickTime, OBS, &lt;code&gt;Win+G&lt;/code&gt;, GNOME’s &lt;code&gt;Ctrl+Shift+Alt+R&lt;/code&gt;, or &lt;code&gt;asciinema&lt;/code&gt; for terminal work) and\nexport &lt;code&gt;.mp4&lt;/code&gt;, &lt;code&gt;.webm&lt;/code&gt; or &lt;code&gt;.gif&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;3. Attach, do not commit.&lt;/strong&gt; Drag the file into the pull request description or a comment:\nGitHub hosts it (about 10 MB for images and GIFs, 100 MB for video), or link a video you host.\nDo not add videos to the repository: they bloat the history forever, and the verification\nreport warns if you do.&lt;/p&gt;\n&lt;p&gt;What proof must not contain: secrets, tokens, personal data, other people’s names, and\nanything from systems you were not authorized to test (see the\n&lt;a href=\&quot;/es/legal/acceptable-use/\&quot;&gt;Acceptable Use Policy&lt;/a&gt;). Blur or crop before recording.&lt;/p&gt;\n&lt;p&gt;Hooks need more care. Say what the hook does, which app and version you tested it on, and\nexpect the reviewer to read every line, because hooks run inside other processes.&lt;/p&gt;\n&lt;h2 id=\&quot;troubleshooting\&quot;&gt;Troubleshooting&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Message&lt;/th&gt;\n&lt;th&gt;Meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;The manifest signature does not match&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The pack was not signed by the os-lab key, or the download was altered. Nothing was installed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;... does not match the signed manifest&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A file differs from what was signed. Nothing was installed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;refusing to go back&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The published pack is older than the one you have. Use &lt;code&gt;reset&lt;/code&gt; first if you really want the bundled copy.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;switched off&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;OSLAB_CONTENT_OFFLINE&lt;/code&gt; is set.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Could not download&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No network, or GitHub is unreachable. The bundled or last installed content keeps working.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Contributing in general: &lt;a href=\&quot;/es/contribute/\&quot;&gt;CONTRIBUTING.md&lt;/a&gt;.&lt;/p&gt;\n&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;ContentInfoPage&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
