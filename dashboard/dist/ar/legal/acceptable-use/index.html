ers will and will not help with, and the law already restricts much of\nthe prohibited use below.&lt;/p&gt;\n&lt;h2 id=\&quot;supported-use\&quot;&gt;Supported use&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Security assessment of applications, devices and systems you own, or that\nyou are authorized in writing to test, within the agreed scope and time.&lt;/li&gt;\n&lt;li&gt;Authorized bug-bounty work within a program’s published scope and rules.&lt;/li&gt;\n&lt;li&gt;Malware analysis and reverse engineering inside isolated guests.&lt;/li&gt;\n&lt;li&gt;Teaching, training and capture-the-flag exercises on targets built for them.&lt;/li&gt;\n&lt;li&gt;Defensive research, detection engineering and compatibility testing.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;not-supported\&quot;&gt;Not supported&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Intercepting, instrumenting, patching or testing apps, devices, accounts or\nnetworks without authorization, or outside the authorized scope.&lt;/li&gt;\n&lt;li&gt;Collecting other people’s credentials, messages, location or other personal\ndata, or monitoring someone without their knowledge or a lawful basis.&lt;/li&gt;\n&lt;li&gt;Building, distributing or operating malware, stalkerware or tools meant to\ncause harm, and using lab guests to attack third parties.&lt;/li&gt;\n&lt;li&gt;Bypassing licensing, DRM, payment or anti-cheat controls of software you do\nnot have rights to, and redistributing patched applications.&lt;/li&gt;\n&lt;li&gt;Running Windows or macOS without the licences their terms require (see the\n&lt;a href=\&quot;/ar/legal/terms/\&quot;&gt;Terms of Use&lt;/a&gt;, section 4).&lt;/li&gt;\n&lt;li&gt;Exposing lab services or the web console to the internet, or letting\nuntrusted users reach them.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Issues, pull requests and discussions that ask for help with unsupported use\nwill be closed.&lt;/p&gt;\n&lt;h2 id=\&quot;responsible-disclosure\&quot;&gt;Responsible disclosure&lt;/h2&gt;\n&lt;p&gt;If your
