y default (section 4).&lt;/p&gt;\n&lt;p&gt;This notice explains what the Software stores on your machine, what it sends\nover the network on your behalf, and where your own obligations begin.&lt;/p&gt;\n&lt;h2 id=\&quot;1-the-web-console-stays-on-your-machine\&quot;&gt;1. The web console stays on your machine&lt;/h2&gt;\n&lt;p&gt;The console (&lt;code&gt;./labctl ui&lt;/code&gt;, or &lt;code&gt;android-lab/lab/web_ui.py&lt;/code&gt;) listens on\n&lt;code&gt;127.0.0.1&lt;/code&gt; only. It rejects requests whose &lt;code&gt;Host&lt;/code&gt; header is not a local\naddress, and every state-changing request must carry an &lt;code&gt;X-OSLab&lt;/code&gt; header, so\nother websites you visit cannot drive it. It makes no outbound internet\nrequests of its own.&lt;/p&gt;\n&lt;h2 id=\&quot;2-what-is-stored-locally\&quot;&gt;2. What is stored locally&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Data&lt;/th&gt;\n&lt;th&gt;Where&lt;/th&gt;\n&lt;th&gt;How long&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Host report: OS, CPU, memory, disk, KVM, WSL distributions, installed tools&lt;/td&gt;\n&lt;td&gt;Console memory&lt;/td&gt;\n&lt;td&gt;Recomputed every few seconds; not written to disk&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Lab jobs: command, output (configured credentials are redacted), exit status&lt;/td&gt;\n&lt;td&gt;Console memory; Source Lab also journals under private storage &lt;code&gt;control/jobs.json&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The 50 most recent; Source records remain until the operator removes them&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Android workbench log&lt;/td&gt;\n&lt;td&gt;Console memory&lt;/td&gt;\n&lt;td&gt;Last 1,000 lines, until cleared or the console stops&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;APKs you upload&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;android-lab/lab/apks/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Until you delete them&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Analysis results, reports, traffic captures&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;android-lab/lab/artifacts/&lt;/code&gt; and each lab’s folders&lt;/td&gt;\n&lt;td&gt;Until you delete them (&lt;code&gt;make clean&lt;/code&gt; for Android)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Source Lab analysis reports, cloned workspaces, merged lab extensions and runtime sessions&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;source-lab/storage/&lt;/code&gt; by default, or the operator-configured storage root&lt;/td&gt;\n&lt;td&gt;Until you delete them; the project does not receive them&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Source Lab opt-in import journals and rollback backups&lt;/td&gt;\n&lt;td&gt;Private storage &lt;code&gt;control/imports/&lt;/code&gt; and &lt;code&gt;control/import-backups/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Retained after import/rollback until the operator removes them&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Source Lab input catalogs and local targets&lt;/td&gt;\n&lt;td&gt;Operator-provided resource/target paths; no third-party datasets are bundled&lt;/td&gt;\n&lt;td&gt;Managed by the operator&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Lab configuration, including passwords you set&lt;/td&gt;\n&lt;td&gt;Each lab’s &lt;code&gt;.env&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Until you change it; shown masked in the console&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;VM disks, backups and shared folders&lt;/td&gt;\n&lt;td&gt;Each lab’s &lt;code&gt;storage/&lt;/code&gt;, &lt;code&gt;backups/&lt;/code&gt;, &lt;code&gt;shared/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Until you delete them&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\&quot;3-what-the-browser-stores\&quot;&gt;3. What the browser stores&lt;/h2&gt;\n&lt;p&gt;The dashboard and the classic console set &lt;strong&gt;no cookies&lt;/strong&gt;. They keep a few\npreferences in your browser’s local storage, which never leave your browser:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Key&lt;/th&gt;\n&lt;th&gt;Purpose&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;theme&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Light or dark mode (dashboard)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;oslab.theme&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Light or dark mode (classic console)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;oslab.sidebar.collapsed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the sidebar is collapsed&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;oslab.spotlight.recents&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Your last few search picks&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;oslab.apk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The target APK path&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;oslab.workflow&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The selected workflow tab (classic console)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Clearing your browser’s site data removes them.&lt;/p&gt;\n&lt;p&gt;Source Lab page selections (target, repository, file, tab, node and filters) can\nappear in the local page URL and browser history. No graph or provider snapshot\nis saved to browser storage by Source Lab. Clear browser history to remove those\nURL records.&lt;/p&gt;\n&lt;p&gt;The &lt;strong&gt;How to use&lt;/strong&gt; page builds a prompt in browser memory from your task and\npublic project context. It does not save the task, include live host data, call an\nLLM or send the task to a server. Submitting copies the generated prompt to your\nsystem clipboard if permission allows; it remains there according to your\nsystem/clipboard-history settings. Clear it there if needed. If you paste it into\nan external LLM, that provider handles it under its own policies; review the\nprompt and remove private data before sharing.&lt;/p&gt;\n&lt;h2 id=\&quot;4-network-connections-made-on-your-behalf\&quot;&gt;4. Network connections made on your behalf&lt;/h2&gt;\n&lt;p&gt;Installing, updating and running the labs contacts third parties. Each one\nreceives your IP address and the request, under its own privacy policy:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;GitHub&lt;/strong&gt;: cloning and updating os-lab; tool downloads such as JADX; and the signed\ncontent pack (Firewall Lab data, guides, hooks) when you press &lt;em&gt;Check for updates&lt;/em&gt; or\n&lt;em&gt;Update content&lt;/em&gt;. Nothing is downloaded in the background, and &lt;code&gt;OSLAB_CONTENT_OFFLINE=1&lt;/code&gt;\nswitches it off.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Package managers&lt;/strong&gt;: apt, dnf, pacman, Homebrew, winget or Chocolatey, PyPI\n(Python dependencies) and npm (when the dashboard is rebuilt).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Container registries&lt;/strong&gt;, mainly Docker Hub, for the lab images.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Microsoft and Apple servers&lt;/strong&gt;, contacted by the Windows and macOS images to\ndownload installation media or recovery images.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Google&lt;/strong&gt; (&lt;code&gt;dl.google.com&lt;/code&gt;): Android platform tools, downloaded when &lt;code&gt;adb&lt;/code&gt;\nis missing (set &lt;code&gt;OSLAB_NO_DOWNLOAD=1&lt;/code&gt; to prevent it), and emulator images.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Source Lab repository acquisition and metadata&lt;/strong&gt;: explicitly invoking its crawler\nor merge acquisition can contact GitHub for selected repositories. Local static\ndetection and structural mapping do not contact a network service. Source Lab\nsetup and readiness checks do not download or install software.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The targets you analyse&lt;/strong&gt; and any service a guest or app connects to. Source\nLab’s optional live browser canary visits only the test URL the operator passes;\nits session events and artifacts stay in local output storage. Simulated canary\nfallback is labeled and excluded from runtime correlation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Docker-Android analytics.&lt;/strong&gt; The Android emulator image reports usage analytics\nto its maintainers (Google Forms) unless disabled, including the host’s OS\nrelease string, feature settings, and city, region and country looked up from\nyour IP address through ipinfo.io. os-lab disables this by default with\n&lt;code&gt;USER_BEHAVIOR_ANALYTICS=false&lt;/code&gt;; set &lt;code&gt;DOCKER_ANDROID_ANALYTICS=true&lt;/code&gt; in\n&lt;code&gt;android-lab/lab/.env&lt;/code&gt; to opt in. Details are in the\n&lt;a href=\&quot;/it/legal/third-party/\&quot;&gt;Third-Party Notices&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\&quot;5-personal-data-inside-your-labs\&quot;&gt;5. Personal data inside your labs&lt;/h2&gt;\n&lt;p&gt;Apps, captured traffic, sandbox dumps and VM guests can contain other people’s\npersonal data. You decide what is processed, so you are the controller for it\nunder the Turkish Personal Data Protection Law No. 6698 (KVKK), the EU GDPR or\nother applicable law. Process it only with a lawful basis, keep it no longer\nthan needed, protect it, and delete it at the end of the engagement. See the\n&lt;a href=\&quot;/it/legal/terms/\&quot;&gt;Terms of Use&lt;/a&gt;, section 5.&lt;/p&gt;\n&lt;h2 id=\&quot;6-contact\&quot;&gt;6. Contact&lt;/h2&gt;\n&lt;p&gt;The maintainers do not receive or hold data from your installation. Questions\nabout this notice: &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/issues\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;GitHub issues&lt;/a&gt;.\nIf you contact the project through GitHub, GitHub’s privacy statement applies\nto that communication.&lt;/p&gt;\n&lt;p&gt;Source Lab runtime settings and its managed session signing key stay in private\nstorage under &lt;code&gt;control/&lt;/code&gt;. Key files use mode 0600 where supported. Keys never\nappear in API responses. Environment-owned keys remain operator-managed.\nChanging a signing key prevents verification of prior sessions with that key;\nretain originals securely if earlier evidence must remain verifiable. Source\njobs report interrupted work after a console restart; partial outputs remain\nlocal for review. Explicit browser canary runs contact the selected test URL.&lt;/p&gt;\n&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;LegalDocPage&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
