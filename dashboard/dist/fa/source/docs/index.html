ew.\nOnly first-party source code and synthetic fixtures are included. Third-party\narchives, datasets and binaries are excluded. Skills, database-backed repository\nmanagement, and OpenAPI integration are also outside the requested scope.\nAnalysis and browsing remain file-backed; engine schemas and generated types stay.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/source-lab/PLAN.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Plan&lt;/a&gt;: integration design, sequence, migration and release criteria.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/source-lab/TODO.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;TODO&lt;/a&gt;: ordered tasks, dependencies and completion evidence.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/source-lab/AUDIT.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Scope audit&lt;/a&gt;: delivered surfaces, exclusions and verification limits.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/source-lab/INVENTORY.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Inventory&lt;/a&gt;: pinned source snapshot, every page/API route and\nengine/data capabilities, with known gaps separated from shipped features.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Start with os-lab’s &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/lat.md/lat.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;architecture graph&lt;/a&gt;,\n&lt;a href=\&quot;/fa/contribute/\&quot;&gt;contribution guide&lt;/a&gt; and\n&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/docs/UX_READINESS.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;UX readiness rules&lt;/a&gt;. The design keeps the existing\nstatic dashboard and local Python console as the user-facing runtime.&lt;/p&gt;\n&lt;h2 id=\&quot;run-locally\&quot;&gt;Run locally&lt;/h2&gt;\n&lt;p&gt;Use Python 3.11+; no Node, Docker or KVM is needed for static analysis.&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; doctor&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; setup&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; detect&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/authorized/target&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; detect&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/authorized/target&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --platform&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; android-app&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --format&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; sarif&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; map&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --root&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/authorized/source&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --out&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/private/repo-map.json&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; crawl&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --help&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; merge&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --help&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Status/doctor are read-only. Setup creates private, gitignored storage and does\nnot install packages or download resources. Export &lt;code&gt;SOURCE_LAB_STORAGE&lt;/code&gt; or\n&lt;code&gt;SOURCE_LAB_RESOURCES&lt;/code&gt; to use other locations; &lt;code&gt;.env&lt;/code&gt; is never evaluated by the\nlauncher. On Windows, invoke &lt;code&gt;python source-lab/run.py&lt;/code&gt; directly.&lt;/p&gt;\n&lt;p&gt;Detection writes reports into separate per-target folders under storage unless\n&lt;code&gt;--output&lt;/code&gt; is supplied. Static runs make no network requests. Explicit crawling,\nmerge acquisition and live browser canary tests may contact the operator’s\nchosen repositories or targets. Use merged extensions only in disposable lab\nprofiles on authorized targets. Synthetic canary fallback is labeled and excluded\nfrom runtime correlation. Native importers remain library entry points.&lt;/p&gt;\n&lt;p&gt;Read &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/source-lab/IMPORT_POLICY.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;import/publication policy&lt;/a&gt; for authorization, exclusions\nand the checks required before each public commit. Retained tests run with\n&lt;code&gt;make -C source-lab test&lt;/code&gt; in a Python environment containing pytest.&lt;/p&gt;\n&lt;h2 id=\&quot;engine-contracts\&quot;&gt;Engine contracts&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;./labctl source contracts&lt;/code&gt; prints the engine JSON Schema; &lt;code&gt;--format typescript&lt;/code&gt;\nprints frontend types generated from the same models. Regenerate committed files:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; contracts&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --out&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source-lab/contracts/schema.json&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; contracts&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --format&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; typescript&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --out&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; dashboard/src/lib/source-contracts.ts&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; contracts&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --check&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/analysis-v2.json&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --kind&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; AnalysisV2&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; contracts&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --check&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/repo-map.json&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --kind&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; RepoMapV1&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;The validator supports the schema vocabulary emitted by this engine, including\nunsupported-version rejection; it is not a general-purpose JSON Schema library.&lt;/p&gt;\n&lt;h2 id=\&quot;review-local-artifacts\&quot;&gt;Review local artifacts&lt;/h2&gt;\n&lt;p&gt;With &lt;code&gt;./labctl ui&lt;/code&gt; running, read-only console routes expose existing outputs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;/api/source/evidence&lt;/code&gt; lists bounded target summaries.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;/api/source/evidence?slug=owner__target&lt;/code&gt; returns findings, coverage and sessions.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;/api/source/evidence?slug=owner__target&amp;amp;session=ses_id&lt;/code&gt; returns up to 500 events.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;/api/source/evidence/report?slug=owner__target&amp;amp;file=summary.md&lt;/code&gt; downloads an\nallowlisted report (JSON artifacts, Markdown or SARIF; STIX stays CLI-only).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;They do not start analyses or expose keys/seals. Session integrity is explicitly\nunverified in these read-only responses. Errors distinguish missing, malformed\nand oversized data; responses are not cached. Target files stay under the\nconfigured private storage root, with symlink and path-traversal checks.&lt;/p&gt;\n&lt;p&gt;The installed console now provides all retained namespaced route adapters, exact\npreviews and shared Source jobs. See &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/source-lab/API.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;API.md&lt;/a&gt; for methods, bounds, explicit\ncontract adaptations and restart/cancellation behavior.&lt;/p&gt;\n&lt;p&gt;The local dashboard includes Overview matrices/inspectors, catalogs and crawler,\nEvidence/runtime settings and verification, Deep analysis/source/maps, Pipeline\nreference and bounded Brain snapshot views. See &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/source-lab/AUDIT.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;AUDIT.md&lt;/a&gt; for each\nretained surface and its limits. Public Source routes are informational and\nnever read local targets or start jobs.&lt;/p&gt;\n&lt;h2 id=\&quot;workflow-documentation\&quot;&gt;Workflow documentation&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;/fa/source/docs/runbook/\&quot;&gt;Operator/release runbook&lt;/a&gt; covers readiness, operation, recovery and release gates.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;/fa/source/docs/collectors/\&quot;&gt;Collectors&lt;/a&gt; distinguishes imported/synthetic sessions from live proof.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;/fa/source/docs/brain/\&quot;&gt;Brain providers&lt;/a&gt; describes bounded snapshots and unavailable application providers.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;/fa/source/docs/import/\&quot;&gt;Legacy import&lt;/a&gt; documents opt-in dry runs, exclusions, hashes and rollback.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The installed and public dashboard documentation routes render these first-party\nguides. They do not expose private output or integrate an OpenAPI reference.&lt;/p&gt;\n&quot;],&quot;slug&quot;:[0,&quot;guide&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;SourceDocs&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
