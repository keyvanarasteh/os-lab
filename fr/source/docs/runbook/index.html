.&lt;/p&gt;\n&lt;h2 id=\&quot;start-and-configure\&quot;&gt;Start and configure&lt;/h2&gt;\n&lt;p&gt;Use Python 3.11+. From os-lab:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; doctor&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; setup&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; ui&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Without Bash, run &lt;code&gt;python source-lab/run.py doctor&lt;/code&gt;, then\n&lt;code&gt;python android-lab/lab/web_ui.py 5050&lt;/code&gt;. The console listens on localhost.\n&lt;code&gt;SOURCE_LAB_PYTHON&lt;/code&gt; selects the console interpreter; &lt;code&gt;SOURCE_LAB_STORAGE&lt;/code&gt; and\n&lt;code&gt;SOURCE_LAB_RESOURCES&lt;/code&gt; select private state and operator inputs. &lt;code&gt;.env&lt;/code&gt; examples\nare not executed. No third-party archive, dataset or binary is bundled.&lt;/p&gt;\n&lt;p&gt;Put authorized directories/packages under private &lt;code&gt;targets/&lt;/code&gt;, or use existing\n&lt;code&gt;cloned-repos/&lt;/code&gt;. Input catalogs belong under configured &lt;code&gt;resources/sources/&lt;/code&gt;.\nNo input upload, arbitrary-path browser endpoint or external deployment is added.&lt;/p&gt;\n&lt;h2 id=\&quot;dashboard-workflows\&quot;&gt;Dashboard workflows&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Page&lt;/th&gt;\n&lt;th&gt;Use&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Readiness&lt;/td&gt;\n&lt;td&gt;Required Python/storage and optional Git/parsers/browser tooling.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Overview / Sources&lt;/td&gt;\n&lt;td&gt;Manifest/background/dependency/permission comparison, inspectors, catalogs and downloads.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Crawler&lt;/td&gt;\n&lt;td&gt;Explicit repositories/source lists, limits, preview/confirmation, logs and cancellation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Evidence&lt;/td&gt;\n&lt;td&gt;Target/platform detection, findings and coverage, H1-H5 scorecard, sessions/events and reports.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Runtime settings&lt;/td&gt;\n&lt;td&gt;Key status/generation/acknowledged rotation, configured canary URL and signed-session verification.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Deep analysis&lt;/td&gt;\n&lt;td&gt;Bundles, source/AST browsing, structural maps and selected local-target reanalysis.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Pipeline&lt;/td&gt;\n&lt;td&gt;Pinned architecture reference or dated operator snapshot; no live-run claim.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Brain&lt;/td&gt;\n&lt;td&gt;Authorized graph/provider snapshots, bounded graph views, metrics, history/diff and export.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;A browser action first previews its exact command/effects/timeout. Review it,\nthen confirm. One Source mutation holds the shared lock. Progress follows actual\nlogs. Failures, cancellation, timeouts and interrupted-on-restart jobs remain\nvisible. Partial outputs and retained artifacts from earlier runs require review\nbefore reuse; selecting fewer stages does not establish that old artifacts are\nfresh. Compare artifact timestamps or use a separate private workspace.&lt;/p&gt;\n&lt;p&gt;Static capability/lead findings are not live proof. Session browsing does not\nverify a signature; use the explicit verification action. Synthetic or failed\ncollections cannot confirm behavior, and correlation needs matching platform and\ntarget. A structural map describes source structure, not runtime evidence.\nNative telemetry importers do not launch native collectors. Live stress testing\nhas no configured application provider. See &lt;a href=\&quot;/os-lab/fr/source/docs/collectors/\&quot;&gt;Collectors&lt;/a&gt; and\n&lt;a href=\&quot;/os-lab/fr/source/docs/brain/\&quot;&gt;Brain providers&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\&quot;optional-tools\&quot;&gt;Optional tools&lt;/h2&gt;\n&lt;p&gt;Static analysis uses the standard library and works without Node/VMs/containers.\nGit supports acquisition. Operator-installed tree-sitter grammars can improve\nparsing; fallback and coverage limitations stay visible. Playwright and Chromium\nare separately installed for live browser canary runs against authorized test\nURLs. The software never installs these automatically. Environment-owned keys\nare changed outside the dashboard; managed keys never appear in the UI.&lt;/p&gt;\n&lt;h2 id=\&quot;import-and-rollback\&quot;&gt;Import and rollback&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;/os-lab/fr/source/docs/import/\&quot;&gt;Legacy import&lt;/a&gt; defaults to a no-copy dry run, requires reviewed hashes\nand explicit authorization to copy, and retains private backups/journals.\nDo not import private browser profiles or unsigned/mismatched sessions. Keep the\noriginal key for older sessions; rotation does not rewrite signatures.&lt;/p&gt;\n&lt;h2 id=\&quot;verify-before-release\&quot;&gt;Verify before release&lt;/h2&gt;\n&lt;p&gt;Run &lt;code&gt;bash scripts/run-tests.sh&lt;/code&gt;, then the dashboard translation and browser\nchecks. Verify local app routes and a Pages build below &lt;code&gt;/os-lab/&lt;/code&gt;, including\nnon-English switching and absence of public engine requests/actions. Check\nprovenance, legal retention/network descriptions and the retained inventory.&lt;/p&gt;\n&lt;p&gt;The portable owned-fixture check can run on this checkout or an installed runtime:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source-lab/acceptance.py&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --out&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source-acceptance.json&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;python&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source-lab/acceptance.py&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --root&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/installed/runtime&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --installed-only&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --out&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source-acceptance.json&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;It runs all five static analyzers with site packages disabled and an empty PATH,\nchecks no false runtime claims, and emits counts/fingerprints without private\npaths or keys. It does not establish GUI/installer/live-collector acceptance.&lt;/p&gt;\n&lt;p&gt;On native macOS and Windows, verify a fresh packaged/minimal install, restart,\nupdate with existing private state, Python 3.11+ readiness, static detection,\npreviews/jobs/cancellation, report/source browsing and the documented optional\nfallbacks. Parse the Windows installer with both PowerShell 5.1 and 7; preserve\nits UTF-8 BOM. Record host/interpreter/app revision and results without private\ntargets, keys, personal paths or session artifacts. Native acceptance remains\nopen under SRC-B01/SRC-B05; live browser checks are SRC-B02. The owner deferred\nthese checks from the integration merge into bonus work. This is a documented\nexception to the initial plan, not a passed native test.&lt;/p&gt;\n&lt;h2 id=\&quot;operation-recovery\&quot;&gt;Operation recovery&lt;/h2&gt;\n&lt;p&gt;Restarted unfinished jobs become &lt;code&gt;interrupted&lt;/code&gt;; they are not reported as success.\nPreserve partial artifacts for review. Import rollback refuses newer edits and\nretains its backups/journal. A desktop update preserves private &lt;code&gt;storage/&lt;/code&gt;; it\nupdates code/dashboard, not user inputs. If reverting the application, restore\nreviewed prior code/build assets and keep private storage backed up separately.\nThere is no automatic data deletion, remote upload, deployment or release action.&lt;/p&gt;\n&quot;],&quot;slug&quot;:[0,&quot;runbook&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;SourceDocs&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
