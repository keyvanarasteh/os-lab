K. VTI&#39;da any-any yok: spoke&#39;lar arası trafik hub&#39;da aynı zone kurallarıyla denetlenir. Uzaktan erişim: Ankara&#39;da sonlanan rol bazlı VPN, MFA (RADIUS/LDAP); havuz 10.255.100.0/22, rol başına /24 (IT-Ops .100, Staff .101, Dev .102) ve havuz kullanıcının normal VLAN kurallarını alır; split tunnel yalnızca 10.0.0.0/8. Öğrencilere VPN verilmez. İnternete açık SSH veya yönetim arayüzü yoktur; HTTP ve Telnet kapalı.&quot;]}],&quot;cveWatch&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;CVE-2025-61624&quot;],&quot;product&quot;:[0,&quot;FortiOS / FortiGate ürün ailesi (70G, 90G, 120G, 900G); Fortinet PSIRT FG-IR-26-122&quot;],&quot;status&quot;:[0,&quot;mitigated&quot;],&quot;note&quot;:[0,&quot;Açıklık: FortiOS yönetim CLI&#39;ında path traversal (CWE-22). Okuma-yazma yetkili bir yönetici hesabı, özel hazırlanmış CLI komutlarıyla dosya yazıp silebilir ve root&#39;a yükselebilir. CVSS: Fortinet 5,4/6,0, NVD 6,5. CISA KEV&#39;e 2026-10-16&#39;da eklendi; aktif istismar bildiriliyor. Etkilenen FortiOS sürümleri: 7.6.0–7.6.4, 7.4.0–7.4.9; 7.2, 7.0 ve 6.4&#39;ün bütün sürümleri. Düzeltilmiş sürümler: 7.6.5+ veya 7.4.10+; 7.2/7.0/6.4 için düzeltme yok, sabit bir sürüme geçmek gerekir. Kaynak: Fortinet CNA kaydı (cve.org), NVD, CISA KEV, GovCERT.HK A26-10-30. FortiGuard sayfası 2026-11-07&#39;de açılamadı. Etkilenme durumu: cihazlar henüz kurulmadı ve FortiOS sürümü belirlenmedi, bu yüzden etkilenip etkilenmediği doğrulanmadı. &#39;mitigated&#39; durumu tasarım düzeyindeki azaltmayı ifade eder, yama uygulandı anlamına gelmez. Geçici önlem (tasarımda var): yönetim arayüzleri internete kapalıdır; yalnızca IT-OPS (10.10.200.0/24) ve VPN-ITOPS&#39;tan, MFA ile ve loglu olarak erişilir. Ek önlemler: yönetici hesapları en az yetkiye indirilir, read-write profiller sınırlı tutulur, yönetici parolaları döndürülür, Wazuh&#39;ta yeni yönetici hesabı ve mesai dışı giriş alarmı (§9.2) kullanılır. Yapılandırma revizyonlarında &#39;../&#39; içeren system.auto-script nesneleri FortiManager ile aranır (Unit 42 tespit önerisi). Kalıcı çözüm: devreye almadan önce dört modelin hepsine 7.4.10+ veya 7.6.5+ yüklenir (iki sürümün sürüm notlarında da bu modeller destekleniyor). Sürüm, kurulum kabul kontrol listesinde FortiManager ile doğrulanır. HA çiftlerinde önce pasif üye, bakım penceresinde yükseltilir. Sonrasında Fortinet PSIRT duyuruları ve CISA KEV aylık takip edilir.&quot;]}]]],&quot;monitoring&quot;:[0,{&quot;siem&quot;:[0,&quot;NOC: Zabbix (cihaz durumu, WAN/VPN erişilebilirliği, alarm ve eskalasyon) + Grafana (NOC panoları). SOC: Wazuh (merkezi log ve SIEM: firewall logları, IPS olayları, yönetici girişleri, sunucu güvenlik olayları). FortiAnalyzer: FortiGate trafik analizi ve güvenlik logları; FortiManager: merkezi firewall yönetimi, yapılandırma değişikliği takibi ve konfigürasyon yedeği (config backup; her gece ve her değişiklikten sonra). Yöntemler: SNMPv3 (1 dk), ICMP (30 sn), Syslog (TLS 6514), NetFlow/sFlow ve FortiGate trafik logları. Hepsi Ankara SERVER VLAN&#39;ında çalışır. Her lokasyonda izleme toplayıcı VM: Zabbix proxy (ProxyOfflineBuffer 72 saat) ve rsyslog (checkpoint&#39;li disk kuyruğu, 7 gün yerel kopya); seçilen modellerde dahili log diski olmadığı için eksiksiz log kopyası toplayıcı → Wazuh yolundan gelir. Merkezde loglar 1 yıl saklanır. Ankara bağımlılığı: Zabbix, lokasyonların genel WAN IP&#39;lerine tünelden bağımsız da ping atar; FortiGate alert email ikinci alarm yoludur; Zabbix, Wazuh ve FortiManager/FortiAnalyzer yapılandırmaları her gece, izleme VM&#39;leri haftalık Akademik&#39;e yedeklenir; uzun Ankara kesintisinde ≤ 4 saatte Akademik hipervizöründe açılır, geri yükleme (restore) testi üç ayda bir.&quot;],&quot;owner&quot;:[0,&quot;Ankara BT ve Ağ Operasyonları (IT-OPS, VLAN 200, 15 kişi). NOC rolü: 3 ağ mühendisi (Zabbix/Grafana; WAN, VPN, firewall, switch, AP ve kapasite raporu); sunucu tarafı 5 sistem yöneticisi. SOC rolü: 2 güvenlik uzmanı (Wazuh/FortiAnalyzer; IPS, yönetici girişi denetimi, aylık kural gözden geçirmesi). Yapılandırma değişikliği alarmı: SOC + BT müdürü. Olay yöneticisi ve eskalasyon: BT müdürü. 1. seviye: 4 kişilik yardım masası. Mesai dışında ağ mühendisleri ve güvenlik uzmanları arasından haftalık dönüşümlü tek nöbetçi yalnızca kritik alarmlara bakar. NOC ve SOC ayrı ekip değil, birer görevdir.&quot;],&quot;alertSink&quot;:[0,&quot;Zabbix ve Wazuh alarmları e-posta ve mesajlaşma uygulaması bildirimi olarak gelir, her olay ticket&#39;a dönüşür; Kritik alarmlar mesai dışında nöbetçinin telefonuna da gider. Ankara&#39;dan bağımsız ikinci yol: her FortiGate&#39;in yerleşik alert email özelliği (VPN kesintisi, kritik IPS olayı, başarısız yönetici girişi) lokasyonun kendi internet çıkışından nöbetçiye. Bant kullanım raporu haftalık otomatik.&quot;],&quot;appVsSecurity&quot;:[0,&quot;Ağ/erişilebilirlik (NOC, Zabbix): ana hat kopması 1 dk → Kritik; doluluk 15 dk &gt; %80 → Yüksek; paket kaybı &gt; %2 → Orta; VPN tünel kesintisi 1 dk → Kritik; firewall CPU 10 dk &gt; %85 veya HA geçişi → Yüksek; DNS yanıtsız → Kritik; DHCP havuzu &gt; %90 → Yüksek; bir lokasyondan 15 dk log gelmemesi veya proxy erişilemezliği → Yüksek. Güvenlik (SOC, Wazuh/FortiAnalyzer): öğrenci/misafir ağından iç ağa 10 dk&#39;da 20 deneme → Orta; kritik IPS imzası → Kritik; 5 dk&#39;da 5 başarısız yönetici girişi → Kritik; ticket&#39;sız kural değişikliği → Yüksek. İlk müdahale: Kritik 15 dk, Yüksek 1 saat, Orta/Düşük 1 iş günü. Süreç NIST SP 800-61&#39;in küçük ekip için sadeleştirilmiş hâli.&quot;]}]}],&quot;locale&quot;:[0,&quot;ar&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;FirewallCompanyPage&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
