AB_STORAGE/analysis/&lt;/code&gt;; embedded source paths remain original forensic\nmetadata and are not rewritten. Workspaces/targets must be supplied separately.&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;# Inspect file counts, source/destination paths, hashes, sessions and exclusions.&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; import-legacy&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/owned/analysis&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --slug&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; owner__repo&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;# After reviewing the dry-run JSON, use its exact fingerprint.&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; import-legacy&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; /path/to/owned/analysis&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --slug&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; owner__repo&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;  --copy&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --authorized&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --expected-plan&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; FINGERPRINT&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;# Inspect rollback, then confirm its fingerprint. Originals remain untouched.&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; import-legacy&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --rollback&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; IMPORT_ID&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; source&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; import-legacy&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --rollback&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; IMPORT_ID&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;  --copy&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --authorized&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --expected-plan&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; ROLLBACK_FINGERPRINT&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;On Windows use &lt;code&gt;python source-lab/run.py import-legacy ...&lt;/code&gt;. The command requires\nPython 3.11+ and no Node/database/browser tooling. &lt;code&gt;--authorized&lt;/code&gt; is an operator\nattestation for the selected local artifacts; it is not a redistribution licence.&lt;/p&gt;\n&lt;p&gt;Allowed inputs are known JSON findings/coverage/manifest/dependency/file-tree/map/\nmetadata reports, indexed AST JSON, Markdown/SARIF/STIX reports, and complete\nsigned sessions with text/JSON artifacts. Unsupported evidence/map versions fail.\nLimits: 5 MB per file, 64 MB per import, 1,000 imported files and bounded directory\nentries. Unknown files are listed as excluded; symlinks/special files are refused.\nArchives, datasets/catalogs, application binaries, databases, Skills, &lt;code&gt;.env&lt;/code&gt;, keys,\ncredentials/configuration trees and deployment files are never copied.&lt;/p&gt;\n&lt;p&gt;Sessions require a valid original signing key in the operator environment or\nalready managed destination storage. No key is imported. Hashes and HMAC must\nverify, and all members must be signed. A session containing private browser\nstate or binary attachments is held out as a whole; deleting members would break\nits integrity. Existing destination session IDs cannot be overwritten. Legacy\nWindows manifest newlines are supported without accepting changed file hashes.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;--settings /path/to/runtime-settings.json&lt;/code&gt; can additionally import only\n&lt;code&gt;{\&quot;testUrl\&quot;:\&quot;https://example.test\&quot;}&lt;/code&gt;. Credential-bearing URLs and all other\nsettings fields are rejected. No request is made to that URL.&lt;/p&gt;\n&lt;p&gt;Copying shares the Source job lock, rechecks source/destination hashes, writes\natomically with private file modes where supported, and journals each replacement\nbefore applying it. Existing reports/settings are backed up under\n&lt;code&gt;control/import-backups/&amp;lt;id&amp;gt;/&lt;/code&gt;; journals are &lt;code&gt;control/imports/&amp;lt;id&amp;gt;.json&lt;/code&gt;. Both\nremain private until the operator removes them. Rollback retains the journal and\nbackups; it restores only files still matching the imported hashes and refuses\nnewer edits before changing anything. Copy failures attempt automatic rollback.\nAfter process interruption, preview rollback by journal ID before retrying.\nStorage failures may require restoring free space/permissions first. Rollback\nremoves imported files, but can leave empty directories. Never delete the backup\nor journal while you still need rollback.&lt;/p&gt;\n&quot;],&quot;slug&quot;:[0,&quot;import&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;SourceDocs&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
