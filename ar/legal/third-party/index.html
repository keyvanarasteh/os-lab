h\nproject’s repository on the date above; always check the project itself for\nthe current terms.&lt;/p&gt;\n&lt;h2 id=\&quot;container-images-pulled-by-the-labs\&quot;&gt;Container images pulled by the labs&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Component&lt;/th&gt;\n&lt;th&gt;Used by&lt;/th&gt;\n&lt;th&gt;Licence&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\&quot;https://github.com/budtmo/docker-android\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Docker-Android&lt;/a&gt; (&lt;code&gt;budtmo/docker-android&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;android-lab emulator&lt;/td&gt;\n&lt;td&gt;Apache-2.0 &lt;strong&gt;with amendments&lt;/strong&gt; on forks and data processing (usage analytics; see below)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\&quot;https://github.com/MobSF/Mobile-Security-Framework-MobSF\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;MobSF&lt;/a&gt; (&lt;code&gt;opensecurity/mobile-security-framework-mobsf&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;android-lab static analysis&lt;/td&gt;\n&lt;td&gt;GPL-3.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\&quot;https://github.com/mitmproxy/mitmproxy\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;mitmproxy&lt;/a&gt; (&lt;code&gt;mitmproxy/mitmproxy&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;android-lab traffic interception&lt;/td&gt;\n&lt;td&gt;MIT&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cryptax/android-re&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;android-lab tools container&lt;/td&gt;\n&lt;td&gt;See the image’s documentation on Docker Hub&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\&quot;https://github.com/dockur/windows\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;dockur/windows&lt;/a&gt; (&lt;code&gt;dockurr/windows&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;win-lab&lt;/td&gt;\n&lt;td&gt;MIT (the container scripts; Windows itself is licensed by Microsoft)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\&quot;https://github.com/dockur/macos\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;dockur/macos&lt;/a&gt; (&lt;code&gt;dockurr/macos&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;ios-lab&lt;/td&gt;\n&lt;td&gt;MIT (the container scripts; macOS itself is licensed by Apple)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\&quot;https://github.com/qemus/qemu\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;qemus/qemu&lt;/a&gt; (&lt;code&gt;qemux/qemu&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;linux-lab&lt;/td&gt;\n&lt;td&gt;MIT (the container scripts; guest operating systems keep their own licences)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\&quot;docker-android-usage-analytics\&quot;&gt;Docker-Android usage analytics&lt;/h3&gt;\n&lt;p&gt;Docker-Android’s licence includes a data-processing amendment: unless disabled,\nthe container reports usage analytics to its maintainers through Google Forms,\nincluding start time, the host’s OS release string, the Docker-Android version,\nfeature flags, device settings, and city, region and country derived from your\nIP address through ipinfo.io. The image honours the opt-out variable\n&lt;code&gt;USER_BEHAVIOR_ANALYTICS=false&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;os-lab sets &lt;code&gt;USER_BEHAVIOR_ANALYTICS=false&lt;/code&gt; by default&lt;/strong&gt; in\n&lt;code&gt;android-lab/lab/docker-compose.yml&lt;/code&gt;, &lt;code&gt;docker-compose.win.yml&lt;/code&gt; and\n&lt;code&gt;scripts/setup-docker-android.sh&lt;/code&gt;. To opt in, set\n&lt;code&gt;DOCKER_ANDROID_ANALYTICS=true&lt;/code&gt; in &lt;code&gt;android-lab/lab/.env&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\&quot;tools-downloaded-or-installed\&quot;&gt;Tools downloaded or installed&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Component&lt;/th&gt;\n&lt;th&gt;Licence&lt;/th&gt;\n&lt;/tr&gt;\n&
