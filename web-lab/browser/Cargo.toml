[package]
name = "weblab"
version = "0.1.0"
edition = "2021"
description = "Web Lab engine: embedded in-app browser windows with JavaScript injection, driven by the os-lab console"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tiny_http = "0.12"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
# Versions follow the ones already locked transitively by tao/wry.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSView"] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKSnapshotConfiguration"] }

[[bin]]
name = "weblab"
path = "src/main.rs"
